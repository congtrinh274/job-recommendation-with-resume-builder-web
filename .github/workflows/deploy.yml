name: Deploy to VPS

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Deploy to VPS via SSH
              uses: appleboy/ssh-action@v1.0.3

              with:
                  host: 180.93.2.20
                  username: root
                  key: ${{ secrets.VPS_SSH_KEY }}

                  script: |
                      cd /root/job-recommendation-with-resume-builder-web
                      git pull origin main
                      docker compose down
                      docker compose up -d --build
