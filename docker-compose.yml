version: '3.9'

services:
    frontend:
        build: ./front-end
        container_name: resume_frontend
        ports:
            - '3000:80'
        env_file:
            - ./front-end/.env
        depends_on:
            - backend
        restart: always

    backend:
    build: ./back-end
    container_name: resume_backend
    ports:
        - '5000:5000'
    env_file:
        - ./back-end/.env
    environment:
        - NODE_ENV=production
    volumes:
        - ./uploads:/app/uploads
    depends_on:
        - ai-service
    restart: always

    ai-service:
        build: ./ai-service
        container_name: resume_ai_service
        ports:
            - '8000:8000'
        env_file:
            - ./ai-service/.env
        restart: always
